
name: Sincronizar Google Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar CLASP
        run: npm install -g @google/clasp

      - name: Configurar autenticacao
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || exit 1
          test -n "$CLASP_JSON" || exit 1
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          chmod 600 "$HOME/.clasprc.json"

      - name: Enviar codigo ao Apps Script
        run: clasp push
